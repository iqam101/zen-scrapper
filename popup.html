<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LeadPitcher AI</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { width: 320px; background: #0f172a; color: #f8fafc; padding: 16px; font-size: 13px; }
    .header { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
    .logo { width: 32px; height: 32px; background: linear-gradient(135deg, #10b981, #0284c7); border-radius: 8px; display: flex; align-items: center; justify-content: center; }
    .logo svg { width: 18px; height: 18px; fill: white; }
    .title h3 { font-size: 14px; font-weight: 700; color: #38bdf8; }
    .title span { font-size: 11px; color: #94a3b8; }
    .stats { display: flex; justify-content: space-between; background: rgba(255, 255, 255, 0.05); padding: 10px; border-radius: 8px; margin-bottom: 14px; border: 1px solid rgba(255, 255, 255, 0.08); }
    .stat-item { text-align: center; }
    .stat-val { font-size: 16px; font-weight: 800; color: #f8fafc; }
    .stat-val.green { color: #34d399; }
    .stat-lbl { font-size: 10px; color: #64748b; text-transform: uppercase; }
    .search-box { margin-bottom: 12px; }
    .search-box input { width: 100%; padding: 8px 10px; background: #1e293b; border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 6px; color: white; font-size: 12px; margin-bottom: 6px; }
    .btn { width: 100%; padding: 9px; font-size: 12px; font-weight: 600; border-radius: 6px; border: none; cursor: pointer; margin-bottom: 8px; display: flex; align-items: center; justify-content: center; gap: 6px; transition: all 0.2s; }
    .btn-primary { background: linear-gradient(135deg, #10b981, #059669); color: white; }
    .btn-secondary { background: rgba(255, 255, 255, 0.08); color: #e2e8f0; border: 1px solid rgba(255, 255, 255, 0.1); }
    .btn-secondary:hover { background: rgba(255, 255, 255, 0.15); }
    .hint { font-size: 11px; color: #64748b; text-align: center; margin-top: 6px; }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">
      <svg viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg>
    </div>
    <div class="title">
      <h3>Zen Scrapper</h3>
      <span>Zenthoz Digital Marketing • Iqam Ifthikar</span>
    </div>
  </div>

  <div class="stats">
    <div class="stat-item">
      <div class="stat-val green" id="pop-total">0</div>
      <div class="stat-lbl">Leads</div>
    </div>
    <div class="stat-item">
      <div class="stat-val" style="color:#fbbf24;" id="pop-faults">0</div>
      <div class="stat-lbl">Faults</div>
    </div>
    <div class="stat-item">
      <div class="stat-val" style="color:#38bdf8;" id="pop-emails">0</div>
      <div class="stat-lbl">Emails</div>
    </div>
  </div>

  <div class="search-box">
    <input type="text" id="pop-search-input" placeholder="e.g. Austin Texas roofing contractor" value="Austin Texas roofing contractor">
    <button class="btn btn-primary" id="pop-btn-search">
      🚀 Search & Scrape on Maps
    </button>
  </div>

  <button class="btn btn-secondary" id="pop-btn-dash">
    📊 Open Full Leads Dashboard
  </button>
  <button class="btn btn-secondary" id="pop-btn-sidepanel">
    📑 Dock Side Panel
  </button>

  <p class="hint">www.zenthoz.com • +1 307 301 2270</p>

  <script src="popup.js"></script>
</body>
</html>
